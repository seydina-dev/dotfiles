wireplumber.settings = {
    # Don't restore last-used sink across sessions — always pick by priority.
    # BT nodes get priority.session = 2010 (below), built-in ALSA gets 1010,
    # so BT becomes default automatically on connect and falls back to built-in
    # when disconnected, without the stored state interfering.
    node.restore-default-targets = false
}

monitor.bluez.properties = {
    bluez5.enable-sbc-xq = true
    bluez5.enable-msbc = true
    bluez5.hfp-hf-rate = 8000
}

bluez5.properties = {
    bluez5.reconnect-profiles = [ a2dp_sink hsp_hs hfp_hf ]
    bluez5.hw-volume = [ a2dp_sink hsp_hs hfp_hf ]
}

wireplumber.rules = [
    {
        matches = [
            {
                node.name = "~bluez_output.*"
            }
        ],
        actions = {
            update-props = {
                node.description = "Bluetooth Headphones"
                # Higher priority than built-in ALSA (default 1010) so BT
                # becomes the default sink automatically on connect.
                priority.session = 2010
            }
        }
    }
]
